# Phase 9 — scheduled corpus freshness (re-fetch → process → index).
# Runs daily and on demand. Fail-closed: no partial promotion if any of the
# five Groww sources fails. Refreshed artifacts are force-committed because
# data/{raw,processed,index} are gitignored for local work.

name: corpus-refresh

on:
  schedule:
    # Daily 10:00 AM IST = 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: corpus-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh corpus (HTTP)
        id: refresh
        continue-on-error: true
        run: python -m ingest.freshness refresh

      - name: Refresh corpus (headless fallback)
        if: steps.refresh.outcome != 'success'
        run: |
          pip install -r requirements-headless.txt
          playwright install --with-deps chromium
          python -m ingest.freshness refresh --headless --no-headless-fallback

      - name: Summarize refresh
        run: |
          echo "### Corpus refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/raw/refresh_report.json ]; then
            echo "- Report: \`data/raw/refresh_report.json\`" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("data/raw/refresh_report.json").read_text(encoding="utf-8"))
          print(f"- Active: {report.get('active_sources')}/5")
          print(f"- Changed: {report.get('changed_count')} unchanged: {report.get('unchanged_count')}")
          print(f"- Headless used: {report.get('headless_used')}")
          PY
          fi
          if [ -f data/raw/latest-live.json ]; then
            echo "- Live manifest: \`data/raw/latest-live.json\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit refreshed artifacts
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add -f data/raw data/processed data/index
          if git diff --cached --quiet; then
            echo "No corpus changes to commit."
            exit 0
          fi
          git commit -m "chore(corpus): daily freshness refresh ($(date -u +%Y-%m-%d))"
          git push
