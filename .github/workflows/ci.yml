name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Phase 8 guardrail scorecard (compliance-critical)
        run: >
          python -m eval.run_eval
          --sets refusal,performance,pii,oos,adversarial
          --compliance-only
