# Railway — FastAPI backend (Phase 10)
# Dashboard: New Project → Deploy from GitHub → set variables below.
# Root Dockerfile is used automatically when present.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
# First boot downloads embedding + reranker weights (not baked into the image).
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

