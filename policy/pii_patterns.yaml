# PII detection patterns (Phase 0 / 4 / 6).
# Runtime should redact before logging/storage. Prefer over-trigger on identity fields.

version: 1

patterns:
  pan:
    description: Indian Permanent Account Number
    # 5 letters + 4 digits + 1 letter (e.g. ABCDE1234F)
    regex: "\\b[A-Z]{5}[0-9]{4}[A-Z]\\b"
    flags: [IGNORECASE]
    min_length: 10
    max_length: 10
    action: redact_and_refuse

  aadhaar:
    description: Aadhaar number (12 digits, optional spaces/hyphens)
    regex: "\\b[2-9][0-9]{3}[\\s-]?[0-9]{4}[\\s-]?[0-9]{4}\\b"
    flags: []
    min_length: 12
    max_length: 14
    action: redact_and_refuse

  account_number:
    description: Generic bank/account-like digit runs (9–18 digits)
    regex: "\\b[0-9]{9,18}\\b"
    flags: []
    # High false-positive risk — use only with surrounding context cues at runtime
    requires_context_keywords:
      - account
      - a/c
      - bank
      - folio
    action: redact_and_refuse

  otp:
    description: One-time password (4–8 digits near OTP cue)
    regex: "\\b[0-9]{4,8}\\b"
    flags: []
    requires_context_keywords:
      - otp
      - one time password
      - one-time
      - verification code
    action: redact_and_refuse

  email:
    description: Email address
    regex: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
    flags: []
    action: redact

  phone:
    description: Indian phone numbers (+91 optional)
    regex: "\\b(?:\\+?91[\\s-]?)?[6-9][0-9]{9}\\b"
    flags: []
    action: redact

# Negative fixtures — must NOT trigger PAN alone
negative_examples:
  - "Nippon India Value Fund Direct Growth"
  - "Direct Growth"
  - "expense ratio 1.27%"
  - "SIP 100"
  - "NIFTY 500"
